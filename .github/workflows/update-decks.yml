name: Update Deck Analysis

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      players:
        description: "Number of top Ranked / Path of Legend players to analyze"
        required: false
        default: "1000"
        type: string

permissions:
  contents: write

concurrency:
  group: deck-analysis-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Analyze decks
        env:
          PLAYERS: ${{ inputs.players || '1000' }}
        run: npm run update
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The workflow may have started from an older commit while
          # another change was pushed to main during analysis.
          # Move HEAD to the latest remote main while keeping the
          # newly generated data file in the working tree.
          git fetch origin main
          git reset --mixed origin/main

          if git diff --quiet -- data/pol-decks.json; then
            echo "No data changes."
            exit 0
          fi

          git add data/pol-decks.json
          git commit -m "chore: update deck analysis data"
          git push origin HEAD:main
